<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TinyIO v3.0 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wdth,wght@6..12,75..125,400..1000&display=swap">
<link rel="stylesheet" href="css/tinyio.css">
<link rel="stylesheet" href="css/screens.css">
<style>
/* prototype chrome (outside the app window) */
#pbar{position:fixed;left:0;right:0;top:0;height:44px;z-index:10;display:flex;align-items:center;gap:12px;padding:0 12px;padding-top:env(safe-area-inset-top,0px);background:rgba(15,19,41,.94);border-bottom:1px solid #3A3F56;font-family:var(--ff)}
.pbrand{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#F9F9FA;white-space:nowrap;display:flex;align-items:center;gap:8px}
.pbrand small{font-size:10px;color:#565D7A;letter-spacing:.08em}
#ptabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.ptab{height:28px;padding:0 12px;border-radius:14px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#A3A8C3;white-space:nowrap}
.ptab:hover{background:#181C37;color:#F9F9FA}
.ptab[aria-current="true"]{background:#39FFD6;color:#0F1329}
.pspace{flex:1}
#psel{height:30px;border-radius:8px;border:1px solid #3A3F56;background:#12152D;color:#F9F9FA;padding:0 8px;font-size:13px;max-width:220px}
.pib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#A3A8C3}
.pib:hover{background:#181C37;color:#F9F9FA}
.pib svg{width:18px;height:18px}
@media (max-width:900px){#ptabs,.pbrand small{display:none}}
</style>
<header id="pbar">
  <div class="pbrand">TinyIO <small>v3.0 · HTML prototype</small></div>
  <nav id="ptabs" aria-label="Alkalmazások"></nav>
  <span class="pspace"></span>
  <button class="pib" id="pprev" aria-label="Előző képernyő"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
  <select id="psel" aria-label="Képernyő"></select>
  <button class="pib" id="pnext" aria-label="Következő képernyő"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
</header>
<main id="stage"><div id="win"></div></main>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens-launcher.js"></script>
<script src="js/screens-dm.js"></script>
<script src="js/screens-db.js"></script>
<script src="js/screens-oc.js"></script>
<script src="js/app.js"></script>

</body></html>
